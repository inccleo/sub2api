name: sub2api-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: sub2api-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: sub2api
      POSTGRES_DB: sub2api
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sub2api-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sub2api-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - sub2api-dev-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sub2api-dev-postgres:
    name: sub2api-dev-postgres
  sub2api-dev-redis:
    name: sub2api-dev-redis
